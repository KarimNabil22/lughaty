<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>رحلة الحروف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg1:#0E2A42;--bg2:#1B4D6B;--cream:#FBF3E0;--gold:#E8B04B;
    --coral:#E86A52;--green:#54A878;--purple:#7C6BB0;--ink:#143247}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;overflow-x:hidden}
  body{font-family:'Baloo Bhaijaan 2','Tajawal',sans-serif;
    background:radial-gradient(120% 80% at 50% -10%,var(--bg2),var(--bg1));color:var(--cream);min-height:100vh;position:relative}
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .twinkle{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3s ease-in-out infinite}
  .bubble{position:absolute;bottom:-40px;border-radius:50%;background:rgba(255,255,255,.06);animation:rise linear infinite}
  @keyframes tw{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.9;transform:scale(1.5)}}
  @keyframes rise{0%{transform:translateY(0)}100%{transform:translateY(-110vh)}}
  .wrap{max-width:560px;margin:0 auto;position:relative;z-index:1;padding:14px}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .title{font-weight:800;font-size:22px}
  .badge{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);padding:6px 14px;border-radius:999px;font-weight:700}
  .iconbtn{background:rgba(255,255,255,.12);border:none;color:var(--cream);width:40px;height:40px;border-radius:999px;font-size:18px;cursor:pointer}
  .panel{background:var(--cream);color:var(--ink);border-radius:24px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.2);text-align:center}
  .btn{border:none;border-radius:16px;padding:12px 20px;font-weight:800;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 5px 0 rgba(0,0,0,.22);color:var(--cream)}
  .btn.gold{background:var(--gold);color:var(--ink)} .btn.ghost{background:rgba(255,255,255,.15)} .btn.purple{background:var(--purple)}
  .press{transition:transform .08s} .press:active{transform:scale(.95)}
  .opt{border:none;border-radius:18px;background:#FFF1CF;color:var(--ink);font-family:inherit;font-weight:800;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;gap:6px}
  .opt.card{width:96px;padding:14px} .opt.card .em{font-size:46px}
  .opt.big{min-width:78px;padding:16px 22px;font-size:22px}
  .opt.letter{min-width:78px;padding:16px;font-size:40px}
  .opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .hint{font-size:13px;opacity:.85;margin-top:8px;text-align:center}
  .worldhdr{font-weight:800;opacity:.9;margin:18px 4px 4px;font-size:15px;text-align:center}
  .lvl{cursor:pointer;width:118px;height:118px;border-radius:28px;border:none;background:var(--cream);color:var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.25);position:relative;display:grid;place-items:center}
  .lvl[disabled]{cursor:not-allowed;background:rgba(255,255,255,.12);color:rgba(255,255,255,.5);box-shadow:none}
  .lvl .l{font-size:50px;font-weight:800;line-height:1} .lvl .n{font-size:12px;font-weight:700;opacity:.7}
  .gtag{position:absolute;top:-10px;inset-inline-start:-8px;background:var(--purple);color:#fff;border-radius:999px;padding:3px 8px;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
  .done{position:absolute;top:-10px;inset-inline-end:-8px;background:var(--green);color:#fff;border-radius:999px;width:30px;height:30px;display:grid;place-items:center;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.2)}
  .react{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none}
  .reactCard{background:#fff;border-radius:24px;padding:14px 22px;font-weight:800;font-size:22px;color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .25s ease both}
  .flystar{position:fixed;z-index:60;font-size:24px;pointer-events:none;transition:transform .7s cubic-bezier(.4,0,.2,1),opacity .7s}
  .arena{position:relative;height:340px;background:#FFF8E8;border-radius:18px;border:3px solid var(--gold);overflow:hidden;margin-top:6px}
  .balloon{position:absolute;bottom:-90px;width:62px;height:78px;border-radius:50% 50% 48% 48%;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;cursor:pointer;box-shadow:inset -6px -8px 0 rgba(0,0,0,.12)}
  .balloon:after{content:'';position:absolute;bottom:-8px;width:2px;height:10px;background:rgba(0,0,0,.25)}
  .chasebar{position:relative;height:64px;background:#FFF8E8;border-radius:18px;border:3px solid var(--gold);margin-top:6px;overflow:hidden}
  .runner{position:absolute;top:14px;font-size:30px;transition:right .25s ease}
  .room{position:relative;height:300px;background:linear-gradient(#243b53,#142536);border-radius:18px;border:3px solid #C9A36A;overflow:hidden;margin-top:6px;box-shadow:inset 0 0 50px rgba(0,0,0,.6)}
  .obj{position:absolute;font-size:46px;cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));transition:transform .1s}
  .obj:active{transform:scale(.9)} .obj.solved{opacity:.45}
  .objbadge{font-size:18px;position:relative;top:-18px}
  .door{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;font-size:60px;cursor:pointer}
  .keysbar{margin-top:8px;font-weight:800;text-align:center}
  .tile{touch-action:none;user-select:none;border:none;border-radius:16px;background:#FFF1CF;color:var(--ink);font-weight:800;font-size:34px;width:74px;height:74px;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.15);cursor:grab}
  .dropzone{border:3px dashed var(--purple);border-radius:18px;min-width:96px;min-height:96px;display:grid;place-items:center;font-size:46px;background:#FFF8E8}
  .dropzone.ok{border-style:solid;border-color:var(--green);background:#E9F6EF}
  .slot{width:74px;height:74px;border-radius:16px;border:3px dashed var(--purple);display:grid;place-items:center;font-size:34px;font-weight:800;color:#bba}
  .slot.filled{border-style:solid;border-color:var(--green);color:var(--ink);background:#E9F6EF}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
  .mcard{height:84px;border-radius:16px;background:var(--purple);color:#fff;font-size:38px;display:grid;place-items:center;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);font-weight:800}
  .mcard.up{background:#FFF1CF;color:var(--ink)} .mcard.matched{background:var(--green);color:#fff;cursor:default}
  .vidbox{margin-top:14px;aspect-ratio:16/9;border-radius:16px;border:3px dashed var(--gold);background:#FFF8E8;display:grid;place-items:center;color:#9A7B3A;gap:4px}
  .chip{border:none;border-radius:14px;padding:10px 14px;font-weight:700;background:#FFF1CF;color:var(--ink);font-family:inherit;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.12);cursor:pointer}
  .morph{position:relative;height:120px;display:grid;place-items:center}
  .morph .m1,.morph .m2{position:absolute;font-size:90px;font-weight:800;transition:opacity .5s,transform .5s}
  .morph.go .m1{opacity:0;transform:scale(.4) rotate(-15deg)} .morph.go .m2{opacity:1;transform:scale(1)}
  .morph .m2{opacity:0;transform:scale(.4)}
  canvas{touch-action:none}
  .float{animation:float 3s ease-in-out infinite} .glow{animation:glow 1.6s ease-in-out infinite}
  .pop{animation:pop .3s ease both} .shake{animation:shake .35s} .jump{animation:jump .5s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}}
  @keyframes burst{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6) translateY(-30px);opacity:0}}
  @keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(240px) rotate(360deg);opacity:0}}
  .conf{position:absolute;top:0;font-size:22px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="wrap">
  <div class="head">
    <div class="title">رحلة الحروف ✦</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="badge">⭐ <span id="stars">0</span></div>
      <button class="iconbtn press" id="mute">🔊</button>
    </div>
  </div>
  <div id="app"></div>
</div>

let actx=null;
function initAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function tone(f,s,d,t,v){const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(actx.destination);const x=actx.currentTime+s;g.gain.setValueAtTime(0,x);g.gain.linearRampToValueAtTime(v,x+.02);g.gain.exponentialRampToValueAtTime(.0001,x+d);o.start(x);o.stop(x+d+.03);}
function sfx(k){if(state.muted)return;try{initAudio();
  if(k==='tap')tone(330,0,.08,'triangle',.15);
  else if(k==='correct'){tone(523,0,.12,'sine',.2);tone(784,.1,.18,'sine',.2);}
  else if(k==='wrong')tone(150,0,.28,'sawtooth',.14);
  else if(k==='pop')tone(700,0,.08,'sine',.18);
  else if(k==='unlock'){tone(440,0,.06,'square',.12);tone(680,.07,.14,'sine',.18);}
  else if(k==='hop')tone(520,0,.1,'sine',.16);
  else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.22,'sine',.2));}
  else if(k==='lose')tone(180,0,.32,'sawtooth',.12);
}catch(e){}}
function buzz(ms){if(navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}
let arVoice=null,audioEl=null;
function loadVoices(){try{const vs=speechSynthesis.getVoices();arVoice=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('ar'))||null;}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function playVoice(key,fallback){
  if(typeof VOICE!=='undefined'&&VOICE[key]){try{if(audioEl)audioEl.pause();audioEl=new Audio(VOICE[key]);audioEl.play();return;}catch(e){}}
  try{const u=new SpeechSynthesisUtterance(fallback||key);u.lang='ar-EG';u.rate=.82;if(arVoice)u.voice=arVoice;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}

const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const exsOf=l=>POOL.filter(p=>p.l===l);
const otherLetters=(l,n)=>shuffle([...new Set(POOL.map(p=>p.l))].filter(x=>x!==l)).slice(0,n);
const otherWords=(l,n)=>shuffle(POOL.filter(p=>p.l!==l)).slice(0,n);

/* مولّد أسئلة متنوّع (اختيارات مختلفة كل مرة) */
function qPick(l,type){
 const exs=exsOf(l),e=exs[Math.floor(Math.random()*exs.length)];
 type=type||['A','B','C','D'][Math.floor(Math.random()*4)];
 if(type==='A'){const d=otherWords(l,2);return {kind:'card',q:`اختار اللي بيبدأ بحرف «${l}»`,options:shuffle([{em:e.e,w:e.w,c:1},{em:d[0].e,w:d[0].w},{em:d[1].e,w:d[1].w}])};}
 if(type==='B'){const o=otherLetters(l,2);return {kind:'letter',q:`فين حرف «${NAMES[l]}»؟`,options:shuffle([{label:l,c:1},{label:o[0]},{label:o[1]}])};}
 if(type==='C'){const d=otherWords(l,2);return {kind:'word',q:'إيه دي؟',emoji:e.e,options:shuffle([{label:e.w,c:1},{label:d[0].w},{label:d[1].w}])};}
 const o=otherLetters(l,2);return {kind:'letter',q:`«${e.w}» بتبدأ بأنهي حرف؟`,emoji:e.e,options:shuffle([{label:l,c:1},{label:o[0]},{label:o[1]}])};
}

const state={screen:'map',level:0,maxUnlocked:1,completed:{},stars:0,muted:false,_int:null};

(function sky(){const s=document.getElementById('sky');let h='';

 for(let i=0;i<6;i++){const d=18+Math.random()*26;h+=`<div class="bubble" style="left:${Math.random()*100}%;width:${d}px;height:${d}px;animation-duration:${10+Math.random()*10}s;animation-delay:${Math.random()*8}s"></div>`;}
 s.innerHTML=h;})();

 <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,.18)"/>
 <circle cx="58" cy="60" r="36" fill="#7C6BB0"/>
 <path d="M40 30 L48 44 L32 42 Z" fill="#7C6BB0"/><path d="M76 30 L68 44 L84 42 Z" fill="#7C6BB0"/>
 <ellipse cx="44" cy="56" rx="13" ry="15" fill="#fff"/><ellipse cx="74" cy="56" rx="13" ry="15" fill="#fff"/>
 <circle cx="46" cy="58" r="6" fill="#143247"/><circle cx="72" cy="58" r="6" fill="#143247"/>
 <circle cx="48" cy="56" r="2" fill="#fff"/><circle cx="74" cy="56" r="2" fill="#fff"/>
 <path d="M50 74 Q58 82 66 74" stroke="#143247" stroke-width="3" fill="none" stroke-linecap="round"/>
 <line x1="92" y1="46" x2="92" y2="66" stroke="#E8B04B" stroke-width="3"/>

 <rect x="87" y="67" width="10" height="12" rx="2" fill="#FFF3C9" class="glow"/></svg>`;}

function react(g){const d=document.createElement('div');d.className='react';
 d.innerHTML=`<div class="reactCard ${g?'jump':'shake'}">${mascot(70)}<span>${g?'برافو! 👏':'حاول تاني 💪'}</span></div>`;
 document.body.appendChild(d);setTimeout(()=>d.remove(),900);}
function flyStars(x,y,n){const t=document.querySelector('.badge').getBoundingClientRect();
 for(let i=0;i<(n||3);i++){const s=document.createElement('div');s.className='flystar';s.textContent='⭐';
  s.style.left=(x-10)+'px';s.style.top=(y-10)+'px';document.body.appendChild(s);
  requestAnimationFrame(()=>{s.style.transform=`translate(${t.left-x+10+i*6}px,${t.top-y+10}px) scale(.5)`;s.style.opacity='0';});
  setTimeout(()=>s.remove(),750);}}
function sparkle(x,y){const s=document.createElement('div');s.style.cssText=`position:fixed;left:${x-12}px;top:${y-12}px;font-size:26px;z-index:60;pointer-events:none;animation:burst .6s ease-out forwards`;s.textContent='✨';document.body.appendChild(s);setTimeout(()=>s.remove(),600);}
function good(x,y,n){sfx('correct');buzz(30);react(true);if(x!=null)sparkle(x,y);}
function bad(){sfx('wrong');buzz([20,40,20]);react(false);}

function optHTML(o,kind){const c=o.c?'1':'0';
 if(kind==='card')return `<button class="opt card press" data-c="${c}"><span class="em">${o.em}</span><span>${o.w}</span></button>`;
 if(kind==='letter')return `<button class="opt letter press" data-c="${c}">${o.label}</button>`;
 return `<button class="opt big press" data-c="${c}">${o.label}</button>`;}
function questionBlock(q){return `${q.emoji?`<div style="font-size:64px">${q.emoji}</div>`:''}
  <div style="font-weight:800;font-size:19px;margin:6px 0 4px">${q.q}</div>
  <div class="opts">${q.options.map(o=>optHTML(o,q.kind)).join('')}</div>`;}
function bindOptions(onPick){app.querySelectorAll('.opt').forEach(b=>b.onclick=ev=>{sfx('tap');onPick(b.dataset.c==='1',b,ev);});}
function exitBtn(){const b=document.getElementById('ex');if(b)b.onclick=()=>{sfx('tap');go('map');};}
function winLevel(){go('win');}

function draw(){({map:drawMap,lesson:drawLesson,game:drawGame,win:drawWin}[state.screen])();}

 let html=`<p style="text-align:center;opacity:.85;margin-top:0">اتعلّم، والعب بطريقة مختلفة كل مرة 🎮</p>`,last='';
 LEVELS.forEach((L,i)=>{
  if(L.world!==last){html+=`<div class="worldhdr">${L.world}</div>`;last=L.world;}

  html+=`<div style="display:flex;justify-content:${side};margin-top:18px">

 app.querySelectorAll('.lvl').forEach(b=>{if(!b.disabled)b.onclick=()=>{sfx('tap');state.level=+b.dataset.i;go('lesson');};});

function drawGame(){({trace:gTrace,balloon:gBalloon,drag:gDrag,memory:gMemory,chase:gChase,escape:gEscape,build:gBuild,story:gStory}[LEVELS[state.level].game])();}

/* 1) اكتب الحرف */
function gTrace(){const L=LEVELS[state.level];
 app.innerHTML=`<div class="hint">امسك بإصبعك وارسم على الحرف لحد ما يكمل ✍️</div>
  <div class="panel" style="margin-top:8px"><div style="position:relative;width:280px;height:280px;margin:0 auto">
     <canvas id="bg" width="280" height="280" style="position:absolute;inset:0"></canvas>
     <canvas id="ink" width="280" height="280" style="position:absolute;inset:0"></canvas></div>
   <div class="row"><button class="btn ghost press" id="clr">↺ امسح</button><button class="btn gold press" id="chk">✅ خلّصت</button></div></div>
  <div class="row"><button class="btn ghost press" id="ex">خروج</button></div>`;
 exitBtn();
 const bg=document.getElementById('bg'),ink=document.getElementById('ink'),b=bg.getContext('2d'),c=ink.getContext('2d');
 b.font='220px "Baloo Bhaijaan 2",sans-serif';b.textAlign='center';b.textBaseline='middle';b.fillStyle='#E7D7AE';b.fillText(L.letter,140,150);
 const mk=document.createElement('canvas');mk.width=280;mk.height=280;const m=mk.getContext('2d');
 m.font=b.font;m.textAlign='center';m.textBaseline='middle';m.fillStyle='#000';m.fillText(L.letter,140,150);
 const md=m.getImageData(0,0,280,280).data;let total=0;for(let i=3;i<md.length;i+=16)if(md[i]>50)total++;
 c.lineWidth=22;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#E8654B';
 let drawing=false,last=null;
 const pos=e=>{const r=ink.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
 ink.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);sfx('tap');});
 ink.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);c.beginPath();c.moveTo(last.x,last.y);c.lineTo(p.x,p.y);c.stroke();last=p;});
 ink.addEventListener('pointerup',()=>{drawing=false;evalDraw(false);});
 ink.addEventListener('pointerleave',()=>{drawing=false;});
 function ratio(){const id=c.getImageData(0,0,280,280).data;let hit=0;for(let i=3;i<md.length;i+=16){if(md[i]>50&&id[i]>30)hit++;}return total?hit/total:0;}
 function evalDraw(manual){if(ratio()>=.4){const r=ink.getBoundingClientRect();good(r.left+r.width/2,r.top+40);setTimeout(winLevel,700);}else if(manual)bad();}
 document.getElementById('clr').onclick=()=>{sfx('tap');c.clearRect(0,0,280,280);};
 document.getElementById('chk').onclick=()=>evalDraw(true);
}

/* 2) نطّ البالونات */
function gBalloon(){const L=LEVELS[state.level];const others=otherLetters(L.letter,6);
 const colors=['#E8654B','#54A878','#7C6BB0','#E8B04B','#3FA7C4'];let popped=0;const GOAL=4;
 app.innerHTML=`<div class="hint">دوس على بالونات حرف «${L.letter}» بس! (محتاج ${GOAL})</div>
  <div class="arena" id="ar"></div><div class="row"><button class="btn ghost press" id="ex">خروج</button></div>`;
 exitBtn();const ar=document.getElementById('ar');
 function spawn(){const isT=Math.random()<.5;const letter=isT?L.letter:others[Math.floor(Math.random()*others.length)];
  const el=document.createElement('div');el.className='balloon';el.textContent=letter;el.style.background=colors[Math.floor(Math.random()*colors.length)];
  el.style.left=(8+Math.random()*78)+'%';const dur=4500+Math.random()*2500;el.style.transition=`bottom ${dur}ms linear`;
  ar.appendChild(el);requestAnimationFrame(()=>{el.style.bottom='360px';});const rm=setTimeout(()=>el.remove(),dur+100);
  el.onclick=e=>{if(letter===L.letter){sfx('pop');buzz(25);popped++;sparkle(e.clientX,e.clientY);el.remove();clearTimeout(rm);
     if(popped>=GOAL){cleanup();good(e.clientX,e.clientY,4);setTimeout(winLevel,700);}}
   else{sfx('wrong');buzz(40);el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),350);}};}
 state._int=setInterval(spawn,800);spawn();
}

/* 3) سحب وإفلات */
function makeDrag(tile,onDrop){
 tile.addEventListener('pointerdown',e=>{e.preventDefault();const r=tile.getBoundingClientRect();const ox=e.clientX-r.left,oy=e.clientY-r.top;
  const sx=tile.style.left,sy=tile.style.top,sp=tile.style.position;tile.style.position='fixed';tile.style.zIndex=70;tile.style.left=(e.clientX-ox)+'px';tile.style.top=(e.clientY-oy)+'px';sfx('tap');
  const mv=ev=>{tile.style.left=(ev.clientX-ox)+'px';tile.style.top=(ev.clientY-oy)+'px';};
  const up=ev=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
   if(!onDrop(ev.clientX,ev.clientY)){tile.style.position=sp;tile.style.left=sx;tile.style.top=sy;tile.style.zIndex='';}};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);});
}
function gDrag(){const lvl=LEVELS[state.level].letter;let round=0;
 const rounds=[lvl,...otherLetters(lvl,2)];
 function render(){const target=rounds[round];const exs=exsOf(target);const cor=exs[Math.floor(Math.random()*exs.length)];
  const distr=otherWords(target,2);const cards=shuffle([{...cor,c:1},...distr]);
  app.innerHTML=`<div class="hint">اسحب الصورة اللي بتبدأ بحرف «${target}» وحطها في الصندوق (${round+1}/3)</div>
   <div class="panel" style="margin-top:8px"><div class="dropzone" id="zone">${target}</div>
     <div class="opts" id="cards">${cards.map(x=>`<div class="tile" data-c="${x.c?1:0}" style="font-size:40px">${x.e}</div>`).join('')}</div></div>
   <div class="row"><button class="btn ghost press" id="ex">خروج</button></div>`;
  exitBtn();const zone=document.getElementById('zone');
  app.querySelectorAll('.tile').forEach(t=>makeDrag(t,(x,y)=>{const r=zone.getBoundingClientRect();
   if(!(x>r.left&&x<r.right&&y>r.top&&y<r.bottom))return false;
   if(t.dataset.c==='1'){zone.classList.add('ok');zone.textContent=t.textContent;t.remove();good(r.left+r.width/2,r.top);round++;setTimeout(()=>{round>=3?winLevel():render();},800);return true;}
   bad();return false;}));}
 render();
}

/* 4) لعبة الذاكرة */
function gMemory(){const lvl=LEVELS[state.level].letter;
 const ls=shuffle([lvl,...otherLetters(lvl,8)]).slice(0,3);
 let cards=[];ls.forEach(l=>{const ex=exsOf(l)[0];cards.push({k:l,t:l,kind:'L'});cards.push({k:l,t:ex.e,kind:'E'});});cards=shuffle(cards);
 let up=[],matched=0,lock=false;
 app.innerHTML=`<div class="hint">طابق الحرف بصورته 🃏</div><div class="panel" style="margin-top:8px"><div class="grid" id="g"></div></div>
  <div class="row"><button class="btn ghost press" id="ex">خروج</button></div>`;
 exitBtn();const g=document.getElementById('g');
 cards.forEach(cd=>{const d=document.createElement('div');d.className='mcard';d.textContent='؟';
  d.onclick=()=>{if(lock||d.classList.contains('up')||d.classList.contains('matched'))return;sfx('tap');d.classList.add('up');d.textContent=cd.t;up.push({d,cd});
   if(up.length===2){lock=true;
    if(up[0].cd.k===up[1].cd.k&&up[0].cd.kind!==up[1].cd.kind){up.forEach(u=>u.d.classList.add('matched'));const r=d.getBoundingClientRect();good(r.left+r.width/2,r.top);matched++;up=[];lock=false;if(matched===3)setTimeout(winLevel,700);}
    else{sfx('wrong');setTimeout(()=>{up.forEach(u=>{u.d.classList.remove('up');u.d.textContent='؟';});up=[];lock=false;},700);}}};
  g.appendChild(d);});
}

/* 5) المطاردة */
let cs;
function gChase(){const L=LEVELS[state.level],LEN=6;
 if(!cs||cs.fresh!==state.level)cs={kid:1,mon:-1,fresh:state.level};
 const q=qPick(L.letter);const kidR=10+(cs.kid/LEN)*78,monR=10+(Math.max(cs.mon,-1)/LEN)*78;
 app.innerHTML=`<div class="chasebar"><div class="runner" style="right:${monR}%">👹</div><div class="runner" style="right:${kidR}%">🐣</div>
    <div style="position:absolute;left:6px;top:18px;font-size:26px">🏁</div></div>
   <div class="hint">اجري للخط 🏁! صح = تتقدّم، غلط = الوحش يقرّب</div>
   <div class="panel pop" style="margin-top:12px">${questionBlock(q)}</div>
   <div class="row"><button class="btn ghost press" id="ex">خروج</button></div>`;
 exitBtn();
 bindOptions((ok,b,ev)=>{if(ok){sfx('hop');buzz(20);sparkle(ev.clientX,ev.clientY);cs.kid++;}else{bad();cs.mon++;}
  if(cs.kid>=LEN){cs=null;return setTimeout(winLevel,400);}
  if(cs.mon>=cs.kid){cs.kid=1;cs.mon=-1;sfx('lose');setTimeout(()=>{gChase();const h=app.querySelector('.hint');if(h)h.textContent='الوحش لحقك! ابدأ تاني 🏃';},300);return;}
  setTimeout(gChase,300);});
}

/* 6) غرفة الهروب (escape room حقيقي) */
let er;
function gEscape(){const L=LEVELS[state.level];
 if(!er||er.fresh!==state.level)er={solved:[false,false,false],keys:0,fresh:state.level,puz:null};
 if(er.puz!=null)return puzzle();
 room();
 function room(){
  app.innerHTML=`<div class="hint">نوري اتحبس في غرفة الساحر! 🔦 دوّر في الحاجات وجمّع ٣ مفاتيح عشان تهرب</div>
   <div class="room">
     <div class="obj" data-o="0" style="left:14%;bottom:16%">🧰<span class="objbadge">${er.solved[0]?'✅':'❔'}</span></div>
     <div class="obj" data-o="1" style="right:12%;top:14%">📚<span class="objbadge">${er.solved[1]?'✅':'❔'}</span></div>
     <div class="obj" data-o="2" style="left:18%;top:12%">🖼️<span class="objbadge">${er.solved[2]?'✅':'❔'}</span></div>
     <div class="door" id="door">${er.keys>=3?'🚪✨':'🚪🔒'}</div>
   </div>
   <div class="keysbar">مفاتيحك: ${'🔑'.repeat(er.keys)||'—'} (${er.keys}/3)</div>
   <div class="row"><button class="btn ghost press" id="ex">خروج</button></div>`;
  exitBtn();
  app.querySelectorAll('.obj').forEach(o=>o.onclick=()=>{const i=+o.dataset.o;sfx('tap');if(er.solved[i])return;er.puz=i;puzzle();});
  document.getElementById('door').onclick=()=>{const r=document.getElementById('door').getBoundingClientRect();
   if(er.keys>=3){er=null;good(r.left+r.width/2,r.top,4);setTimeout(winLevel,600);}
   else{bad();const k=document.querySelector('.keysbar');k.textContent='الباب لسه مقفول — محتاج ٣ مفاتيح! '+('🔑'.repeat(er.keys));}};
 }
 function puzzle(){const i=er.puz;const q=qPick(L.letter,['A','C','D'][i]);
  app.innerHTML=`<div class="hint">لغز ${i+1} — حلّه عشان تطلّع مفتاح 🔑</div>
   <div class="panel pop" style="margin-top:8px">${questionBlock(q)}</div>
   <div class="row"><button class="btn ghost press" id="ex">↩︎ رجوع للغرفة</button></div>`;
  document.getElementById('ex').onclick=()=>{sfx('tap');er.puz=null;gEscape();};
  bindOptions((ok,b,ev)=>{if(!ok){bad();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),350);return;}
   sfx('unlock');good(ev.clientX,ev.clientY);er.solved[i]=true;er.keys++;er.puz=null;setTimeout(gEscape,800);});
 }
}

/* 7) كوّن الكلمة */
function gBuild(){const L=LEVELS[state.level];const order=L.syll;const tiles=shuffle(order.map((s,i)=>({s,i})));
 app.innerHTML=`<div class="hint">رتّب المقاطع وكوّن كلمة «${L.word}» ${L.emoji}</div>
  <div class="panel" style="margin-top:8px"><div class="opts" id="slots">${order.map((_,i)=>`<div class="slot" data-i="${i}"></div>`).join('')}</div>
   <div class="opts" id="tiles" style="margin-top:18px">${tiles.map(t=>`<div class="tile" data-i="${t.i}">${t.s}</div>`).join('')}</div></div>
  <div class="row"><button class="btn ghost press" id="ex">خروج</button></div>`;
 exitBtn();let filled=0;
 app.querySelectorAll('#tiles .tile').forEach(t=>makeDrag(t,(x,y)=>{const slot=document.querySelector(`.slot[data-i="${t.dataset.i}"]`);if(!slot)return false;
  const r=slot.getBoundingClientRect();if(!(x>r.left-20&&x<r.right+20&&y>r.top-20&&y<r.bottom+20))return false;
  slot.classList.add('filled');slot.textContent=t.textContent;t.remove();filled++;good(r.left+r.width/2,r.top);
  if(filled===order.length){playVoice(L.word,L.word);setTimeout(winLevel,900);}return true;}));
}

/* 8) مغامرة نوري (قصة تفاعلية بقرارات) */

 function steps(){return [
  {say:'النهاردة نوري طالع مغامرة! 🌟 تعالى معاه.'},
  {choice:'نوري يروح فين الأول؟',opts:[{t:'🌊 البحر',v:'بحر'},{t:'🏔️ الجبل',v:'جبل'}]},

  {say:'صاحبه الجديد قاله: تعالى نلعب مع بعض! 🎈'},
  {q:()=>({kind:'big',q:'اقرا: «نوري فرحان». نوري حاسس بإيه؟',options:shuffle([{label:'فرحان',c:1},{label:'زعلان'},{label:'تعبان'}])})},
  {say:'لعبوا لحد الليل 🌙 ورجعوا البيت مبسوطين. تمت المغامرة! 🎉'},
  {end:1}
 ];}
 const S=steps();
 function render(){const s=S[si];if(s.end)return winLevel();
  const say=typeof s.say==='function'?s.say():s.say;
  if(s.choice){app.innerHTML=`<div style="text-align:center">${mascot(90)}</div>
    <div class="panel pop" style="margin-top:6px"><div style="font-weight:800;font-size:20px">${s.choice}</div>
    <div class="opts">${s.opts.map((o,i)=>`<button class="opt big press" data-v="${o.v}">${o.t}</button>`).join('')}</div></div>
    <div class="row"><button class="btn ghost press" id="ex">خروج</button></div>`;
   exitBtn();app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sfx('tap');pick=b.dataset.v;good();si++;setTimeout(render,500);});
  }else if(s.say){app.innerHTML=`<div style="text-align:center">${mascot(90)}</div>
    <div class="panel pop" style="margin-top:6px"><div style="font-weight:800;font-size:20px;line-height:1.7">${say}</div>
    <button class="btn gold press" id="n" style="margin-top:14px">كمّل ▶️</button></div>
    <div class="row"><button class="btn ghost press" id="ex">خروج</button></div>`;
   document.getElementById('n').onclick=()=>{sfx('tap');si++;render();};exitBtn();
  }else{const q=typeof s.q==='function'?s.q():s.q;
   app.innerHTML=`<div class="panel pop">${questionBlock(q)}</div><div class="row"><button class="btn ghost press" id="ex">خروج</button></div>`;exitBtn();
   bindOptions((ok,b,ev)=>{if(!ok){bad();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),350);return;}good(ev.clientX,ev.clientY);si++;setTimeout(render,600);});}
 }
 render();
}

function drawWin(){sfx('win');buzz([30,40,30]);const i=state.level;
